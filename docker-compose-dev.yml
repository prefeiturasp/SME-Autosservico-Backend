services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sme_autosservico_backend_dev
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "True"
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
      - "5678:5678"
